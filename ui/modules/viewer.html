<!doctype html>
<!-- Draws a module display (Plotly figure, Vega-Lite spec) for the app (WKWebView)
     and the web UI (a sandboxed iframe). The libraries sit next to this file. -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font: 12px -apple-system, system-ui, sans-serif; }
  #view { position: absolute; inset: 0; }
  body.still { pointer-events: none; }
  body.scroll { overflow: auto; }
  body.scroll #view { position: static; }
  #error { position: absolute; inset: 0; display: none; padding: 8px; color: #b3261e; white-space: pre-wrap; }
  body[data-state="error"] #error { display: block; }
</style>
</head>
<body>
<div id="view"></div>
<div id="error"></div>
<script src="viewer.js"></script>
</body>
</html>
