name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 18 * * *' # Nightly at 03:17 JST.
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      selection: ${{ steps.diff.outputs.selection }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          selection=$(python3 tests/ci/select.py --event "$EVENT" --base "$BASE" --head "$HEAD")
          echo "$selection" | jq .
          echo "selection=$selection" >> "$GITHUB_OUTPUT"

  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # Tests that read only files of the repository (tests/static, marked
      # "static"): the same pytest as the Python environments, nothing else.
      - name: Static tests
        run: nix shell --inputs-from . nixpkgs#python3Packages.pytest -c pytest -q -m static tests/static

  platform:
    name: Platform (${{ matrix.system }})
    needs: [changes, static]
    if: ${{ fromJSON(needs.changes.outputs.selection).platform }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.selection).matrix }}
    uses: ./.github/workflows/ci-platform.yml
    with:
      system: ${{ matrix.system }}
      runner: ${{ matrix.runner }}
      checks: ${{ toJSON(matrix.checks) }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' && secrets.CACHIX_AUTH_TOKEN || '' }}

  prompt:
    name: Offline prompt scoring
    needs: [changes, static]
    if: ${{ fromJSON(needs.changes.outputs.selection).prompt }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests/prompt

  docs:
    name: Documentation
    needs: [changes, static]
    if: ${{ fromJSON(needs.changes.outputs.selection).docs }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml

  result:
    name: CI
    needs: [changes, static, platform, prompt, docs]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
          SELECTION: ${{ needs.changes.outputs.selection }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$RESULTS"
          # Skips are allowed only for checks the selector did not request.
          jq -e --argjson selected "$SELECTION" '
            . as $results |
            (.changes.result == "success" and .static.result == "success") and
            (["platform", "prompt", "docs"] | all(.[]; . as $job |
              $results[$job].result == (if $selected[$job] then "success" else "skipped" end)))
          ' <<<"$RESULTS" > /dev/null
