# The core and its tests on Linux: tsugumid, the C++ tests and the Python
# tests against a host tsugumid (Cards sandboxed with bubblewrap). The macOS
# app and the shared VM need Apple silicon and are tested on a Mac.
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  core:
    name: tsugumid and Python tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Allow user namespaces for bubblewrap
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Card shell steps get the dev shell's bash and tools (as the package
      # gives them its own), not whatever the host has.
      - name: Build tsugumid and run the C++ tests
        run: |
          nix develop -c bash -c '
            set -e
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DTSUGUMI_BWRAP="$(command -v bwrap)" \
              -DTSUGUMI_BASH="$(command -v bash)" -DTSUGUMI_CARD_PATH="$PATH"
            ninja -C build
            ctest --test-dir build --output-on-failure'
      - name: Python tests
        run: nix develop -c bash -c 'cd tests/python && python3 -m pytest -q'
