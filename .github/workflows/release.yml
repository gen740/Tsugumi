# Builds the app for a version and publishes it as a GitHub release:
# Tsugumi.zip (the app, ad-hoc signed, `build-app.sh --release`) and
# Tsugumi.zip.sha256, which installed release builds read to update themselves
# (macOS/Sources/App/Model/Updater.swift), Tsugumi.dmg, for people installing it
# from a browser, and the `tsugumi` command (macOS, Linux, Windows through WSL):
# install.sh and install.ps1 (cli/) with
# the files they take, tsugumi-macos-arm64.tar.gz and tsugumi-linux.tar.gz.
#
# Started by a tag v<major.minor.patch> or v<major.minor.patch>-rc.<number>.
# The numeric version must match VERSION. An RC tag publishes a prerelease.
# (macOS/tools/release.sh makes and pushes one), or by hand with a version:
# then VERSION is set to it on main, committed and tagged here.
name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (major.minor.patch); VERSION on main is set to it
        required: true
permissions:
  contents: write
concurrency: release
jobs:
  app:
    name: Build and publish the app (macOS)
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # the build number is the number of commits
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
      - name: Tag the version (run by hand)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          v="$VERSION_INPUT"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a version: $v" >&2; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$(cat VERSION)" != "$v" ]; then
            echo "$v" > VERSION
            git commit -qm "Release $v" VERSION
          fi
          git tag -a "v$v" -m "Tsugumi $v"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/v$v"
          echo "TAG=v$v" >> "$GITHUB_ENV"
      - name: The tag is the version in VERSION
        run: |
          tag="${TAG:-$GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-rc\.[1-9][0-9]*)?$ ]] || { echo "not a release tag: $tag" >&2; exit 1; }
          version="${BASH_REMATCH[1]}"
          test "$(cat VERSION)" = "$version"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-nix
        with:
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # The VM boot disk is downloaded from gen740/tsugumi-vm.
      - name: Build the app
        run: macOS/build-app.sh --release
      - name: Check and package the app
        run: |
          set -euo pipefail
          app=dist/Tsugumi.app
          codesign --verify --deep --strict "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :TsugumiChannel' "$app/Contents/Info.plist")" = release
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$PACKAGE_VERSION"
          (cd dist && ditto -c -k --sequesterRsrc --keepParent Tsugumi.app Tsugumi.zip && shasum -a 256 Tsugumi.zip > Tsugumi.zip.sha256)
          mkdir dist/dmg && ditto "$app" dist/dmg/Tsugumi.app && ln -s /Applications dist/dmg/Applications
          codesign --verify --deep --strict dist/dmg/Tsugumi.app
          hdiutil create -volname Tsugumi -srcfolder dist/dmg -ov -format UDZO dist/Tsugumi.dmg
          rm -rf dist/dmg
          ls -l dist/Tsugumi.zip dist/Tsugumi.dmg
      - name: Package the tsugumi command
        run: |
          set -euo pipefail
          cli/package-macos.sh
          cli/package-linux.sh
          mkdir dist/check
          tar -xzf dist/tsugumi-macos-arm64.tar.gz -C dist/check
          test "$(dist/check/tsugumi/tsugumi --version)" = "$PACKAGE_VERSION"
          codesign --verify --strict dist/check/tsugumi/bin/tsugumi-vmhost
          codesign -d --entitlements - dist/check/tsugumi/bin/tsugumi-vmhost 2>/dev/null | grep -q com.apple.security.virtualization
          rm -rf dist/check
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_flags=()
          if [[ "$TAG" == *-rc.* ]]; then
            release_flags=(--prerelease --latest=false)
            cat > notes.md <<'NOTES'
          This is a pre-release for testing. Download the assets from this release to install it manually. The app requires Apple silicon and macOS 26 or later.

          For the command-line installer, set `TSUGUMI_VERSION` to the tag without its initial `v`. The default installer selects the latest stable release.
          NOTES
          else
            cat > notes.md <<'NOTES'
          Apple silicon Mac / macOS 26 以降。インストール済みの Tsugumi は自動でこの版に更新されます（次に終了したとき）。

          新しく入れる場合は Tsugumi.dmg を開いて Applications へ入れます。ad-hoc 署名のため、ブラウザでダウンロードしたものは Gatekeeper に止められます。一度だけ `xattr -dr com.apple.quarantine /Applications/Tsugumi.app` を実行してください。

          curl で入れる場合（Gatekeeper に止められません）:

          ```bash
          curl -fL -o /tmp/Tsugumi.zip https://github.com/gen740/Tsugumi/releases/latest/download/Tsugumi.zip && ditto -x -k /tmp/Tsugumi.zip /Applications && open /Applications/Tsugumi.app
          ```

          ブラウザの Web UI で使う場合（Linux は Nix が必要。Windows は WSL2 と Nix が必要）:

          ```bash
          curl -fsSL https://github.com/gen740/Tsugumi/releases/latest/download/install.sh | sh
          ```

          ```powershell
          irm https://github.com/gen740/Tsugumi/releases/latest/download/install.ps1 | iex
          ```
          NOTES
          fi
          gh release create "$TAG" dist/Tsugumi.zip dist/Tsugumi.zip.sha256 dist/Tsugumi.dmg cli/install.sh cli/install.ps1 \
            dist/tsugumi-macos-arm64.tar.gz dist/tsugumi-macos-arm64.tar.gz.sha256 \
            dist/tsugumi-linux.tar.gz dist/tsugumi-linux.tar.gz.sha256 \
            --verify-tag --title "Tsugumi ${TAG#v}" --notes-file notes.md --generate-notes ${release_flags[@]+"${release_flags[@]}"}
