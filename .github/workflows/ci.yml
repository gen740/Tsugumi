name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 18 * * *' # Nightly at 03:17 JST.
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    outputs:
      selection: ${{ steps.diff.outputs.selection }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          selection=$(python3 tests/ci/select_jobs.py --event "$EVENT" --base "$BASE" --head "$HEAD" ${{ github.event_name == 'pull_request' && github.base_ref != 'main' && '--stacked' || '' }})
          echo "$selection" | jq .
          echo "selection=$selection" >> "$GITHUB_OUTPUT"

  static:
    name: Static checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # Tests that read only files of the repository (tests/static, marked
      # "static"): the same pytest as the Python environments, nothing else.
      - name: Static tests
        run: nix shell --inputs-from . nixpkgs#python3Packages.pytest -c python3 tests/run-isolated.py pytest -q -m static tests/static

  platform:
    name: Platform (${{ matrix.system }})
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.selection).platform }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.selection).matrix }}
    uses: ./.github/workflows/ci-platform.yml
    with:
      system: ${{ matrix.system }}
      runner: ${{ matrix.runner }}
      tests: ${{ toJSON(matrix.tests) }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' && secrets.CACHIX_AUTH_TOKEN || '' }}

  web-typecheck:
    name: Web TypeScript
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.selection)['web-typecheck'] }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nix
        with:
          cachix-token: ${{ github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' && secrets.CACHIX_AUTH_TOKEN || '' }}
      - run: nix build -L --no-link .#checks.x86_64-linux.web-typecheck

  vm:
    name: Release-built guest closure
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.selection).vm }}
    uses: ./.github/workflows/vm-image.yml
    with:
      revision: ${{ github.sha }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' && secrets.CACHIX_AUTH_TOKEN || '' }}

  pack-guest:
    name: tsugumi-pack guest
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.selection)['pack-guest'] }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nix
        with:
          cachix-token: ${{ github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' && secrets.CACHIX_AUTH_TOKEN || '' }}
      # pack/build.sh takes this folder as TSUGUMI_PACK_GUEST, so the guest
      # need not be built on a Mac.
      - name: Build the export and runner images
        run: |
          nix build -L ".#packages.aarch64-linux.pack-guest" -o build-pack-guest
          mkdir -p dist/pack-guest
          cp build-pack-guest/{vmlinux,export.erofs,run.erofs,identity} dist/pack-guest/
      - uses: actions/upload-artifact@v4
        with:
          # The branch's commit, not a pull request's merge commit.
          name: pack-guest-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/pack-guest
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  prompt:
    name: Offline prompt scoring
    needs: [changes, static]
    if: ${{ fromJSON(needs.changes.outputs.selection).prompt }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests/prompt

  docs:
    name: Documentation
    needs: [changes, static]
    if: ${{ fromJSON(needs.changes.outputs.selection).docs }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml

  result:
    name: CI
    needs: [changes, static, platform, web-typecheck, vm, pack-guest, prompt, docs]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
          SELECTION: ${{ needs.changes.outputs.selection }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$RESULTS"
          # Skips are allowed only for checks the selector did not request.
          jq -e --argjson selected "$SELECTION" '
            . as $results |
            (.changes.result == "success" and .static.result == "success") and
            ($selected | del(.matrix) | to_entries | all(.[]; . as $job |
              $results[$job.key].result == (if $job.value then "success" else "skipped" end)))
          ' <<<"$RESULTS" > /dev/null
