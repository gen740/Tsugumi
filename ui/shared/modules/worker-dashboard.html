<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html,body{margin:0;height:100%;overflow:hidden}iframe{display:block;border:0;width:100%;height:100%}</style>
</head><body><script>
'use strict'
function mount(event) {
  if (event.source !== parent || event.data?.type !== 'worker-dashboard' ||
      typeof event.data.html !== 'string' || event.ports.length !== 1) return
  removeEventListener('message', mount)
  const [port] = event.ports
  const frame = document.createElement('iframe')
  frame.setAttribute('sandbox', 'allow-scripts')
  frame.title = event.data.title
  frame.srcdoc = event.data.html
  frame.addEventListener('load', () => {
    frame.contentWindow.postMessage('tsugumi-worker-dashboard', '*', [port])
  }, { once: true })
  document.body.append(frame)
}
addEventListener('message', mount)
</script></body></html>
