# Opt-in: use a dedicated Apple Silicon Mac with Virtualization.framework.
# Only trusted main runs here; pull requests keep using the hosted CI.
name: Shared VM
on:
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * 1'
permissions:
  contents: read
concurrency:
  group: shared-vm
  cancel-in-progress: false
jobs:
  vm:
    if: vars.TSUGUMI_VM_CI == '1' && github.repository == 'gen740/Tsugumi' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64, tsugumi-vm]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          # Keep the test VM's local Nix store between trusted runs.
          clean: false
      - name: Build and test in the shared VM
        run: macOS/tools/test-vm.sh
      - name: Preserve test results and VM diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-vm-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/vm-ci/
          if-no-files-found: warn
          retention-days: 14
