.title{font-size:28px;font-weight:700}.heading{font-size:19px;font-weight:650}.node{font-weight:650}.small{font:13px ui-monospace,monospace;fill:#b4c6cc}.center{text-anchor:middle}.end{text-anchor:end}
.span0{transform-origin:44px 152px;animation:s0 9s linear infinite}@keyframes s0{0%,8.02%{transform:scaleX(0)}72.97%,100%{transform:scaleX(1)}}
.span1{transform-origin:44px 207px;animation:s1 9s linear infinite}@keyframes s1{0%,8.03%{transform:scaleX(0)}73.0%,100%{transform:scaleX(1)}}
