# The core and its tests on Linux: tsugumid, the C++ tests and the Python
# tests against a host tsugumid (Cards sandboxed with bubblewrap); the web UI
# built and checked. On macOS: the Swift packages' tests against a host
# tsugumid. The shared VM (Virtualization.framework) is not available on
# hosted runners and is tested on a Mac (TSUGUMI_TEST_CONTAINER=1).
name: CI
on:
  push:
    branches: [main]
  pull_request:
# A new push to a pull request replaces its run; main keeps every run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Documents alone need no Swift build. The app does read four of them
  # (Help > Tsugumi を知る, macOS/Tests checks that it finds them).
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          app=true
          if files="$(git diff --name-only "$BASE" HEAD)" && [ -n "$files" ]; then
            others="$(grep -vE '^docs/|^[A-Z_]+\.md$' <<<"$files" || true)"
            read_by_app="$(grep -E '^(README\.md|docs/(Philosophy|Name|Author)\.md)$' <<<"$files" || true)"
            if [ -z "$others$read_by_app" ]; then app=false; fi
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
  core:
    name: tsugumid and Python tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Allow user namespaces for bubblewrap
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Card shell steps get the dev shell's bash and tools (as the package
      # gives them its own), not whatever the host has.
      - name: Build tsugumid and run the C++ tests
        run: |
          nix develop -c bash -c '
            set -e
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DTSUGUMI_BWRAP="$(command -v bwrap)" \
              -DTSUGUMI_BASH="$(command -v bash)" -DTSUGUMI_CARD_PATH="$PATH"
            ninja -C build
            ctest --test-dir build --output-on-failure'
      - name: Web UI typecheck, behavior contracts and build (Python tests cover RPC and server)
        run: nix develop -c bash -c 'cd web && npm ci && npm run gen && npm run typecheck && npm test && npm run build'
      # docs/site/js/player.js bundles web/src (canvasKit.ts, cardNode.tsx...) and the gallery and Home
      # thumbnails run it: a change there needs `node docs/site/player/build.mjs`. (The pages are checked by test_docs.py.)
      - name: Documentation site player is up to date (docs/site/js/player.js, player.css, player-data/)
        run: nix develop -c node docs/site/player/build.mjs --check
      - name: Python tests
        run: nix develop -c bash -c 'cd tests/python && python3 -m pytest -q'

  macos:
    name: Swift tests (macOS, no VM)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # The worker runs the Cards an Agent test builds (TeamTests runs bash Cards).
      - name: Build the host tsugumid and its worker (the Swift tests talk to them)
        run: nix develop -c bash -c 'cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug && ninja -C build tsugumid tsugumi-worker'
      # The packages' builds, kept per dependency set: what did not change is not compiled again.
      - name: Cache the Swift builds
        uses: actions/cache@v4
        with:
          path: |
            macOS/.build
            macOS/CoreTests/.build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('macOS/Package.resolved', 'macOS/CoreTests/Package.resolved', 'macOS/Package.swift', 'macOS/CoreTests/Package.swift', 'agent/Package.swift') }}
      # Swift and its SDK are Xcode's; only flatc comes from the flake.
      - name: Model, RPC, Agent and launcher (macOS/CoreTests)
        run: |
          TSUGUMI_FLATC="$(nix develop -c which flatc)"
          export TSUGUMI_FLATC
          cd macOS/CoreTests && swift test
      - name: Cache the Dawn renderer
        uses: actions/cache@v4
        with:
          path: build-renderer
          key: renderer-${{ runner.os }}-${{ hashFiles('ui/renderer/**', 'CMakeLists.txt') }}
      - name: Build the Dawn renderer (the app package links it)
        run: '[ -f build-renderer/ui/renderer/libtsugumi_renderer.dylib ] || ui/renderer/build.sh'
      - name: App logic (macOS/Tests)
        run: |
          TSUGUMI_FLATC="$(nix develop -c which flatc)"
          export TSUGUMI_FLATC
          cd macOS && swift test
