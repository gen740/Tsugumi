name: Release-built guest image
on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
      runtime-artifact:
        description: Native runtime artifact from the current CI run.
        type: string
        default: ''
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false
    outputs:
      identity:
        value: ${{ jobs.image.outputs.identity }}
      artifact:
        value: ${{ jobs.image.outputs.artifact }}
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-24.04-arm
    outputs:
      identity: ${{ steps.definition.outputs.identity }}
      artifact: vm-${{ steps.definition.outputs.identity }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
      - uses: ./.github/actions/setup-nix
        with:
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - id: definition
        name: Evaluate the complete guest definition
        run: |
          stage="$RUNNER_TEMP/tsugumi-guest-source"
          python3 vm/guest/tools/vm-snapshot.py "$GITHUB_WORKSPACE" "$stage"
          echo "GUEST_BUILD_ROOT=$stage" >> "$GITHUB_ENV"
          identity=$(nix eval --raw "path:$stage#packages.aarch64-linux.vm-boot.outPath")
          echo "identity=${identity##*/}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/fetch-nix
        if: inputs.runtime-artifact != ''
        with:
          package: ci-runtime
          system: aarch64-linux
          artifact-name: ${{ inputs.runtime-artifact }}
          artifact-fallback: ${{ secrets.CACHIX_AUTH_TOKEN == '' }}
          out-link: build-ci
      - name: Build the native runner for a standalone release
        if: inputs.runtime-artifact == ''
        run: nix build .#ci-runtime --out-link build-ci
      - name: Build the VM lifetime test
        run: nix build .#ci-vm-tests --out-link build-ci-vm-tests
      - name: Build the guest image from the production archives
        run: |
          nix build -L "path:$GUEST_BUILD_ROOT#packages.aarch64-linux.vm" -o build-vm
      - name: Guest runtime and lifetime contracts
        run: |
          build-ci/bin/tsugumi-test-env build-ci-vm-tests/libexec/tsugumi-tests/tsugumi_vm_lifetime_tests
          runtime=$(nix build --no-link --print-out-paths "path:$GUEST_BUILD_ROOT#tsugumid")
          test -x "$runtime/bin/tsugumid"
          test -x "$runtime/bin/tsugumi-vmd"
          test -x "$runtime/bin/tsugumi-worker"
      - name: Assemble and verify the image artifact
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          python3 "$GUEST_BUILD_ROOT/vm/guest/tools/vm-artifact.py" build build-vm dist/tsugumi-vm --revision "$REVISION"
      - uses: actions/upload-artifact@v4
        with:
          name: vm-${{ steps.definition.outputs.identity }}
          path: |
            dist/tsugumi-vm/tsugumi-vm.tar.gz
            dist/tsugumi-vm/vm-manifest.json
            dist/tsugumi-vm/SHA256SUMS
          if-no-files-found: error
