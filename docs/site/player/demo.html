<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo player (dev page)</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../site.css">
<style>
  body { margin: 0 auto; max-width: 1100px; padding: 24px 16px 80px; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-top: 16px; }
  #grid a { display: block; color: inherit; text-decoration: none; }
  .thumb { height: 170px; border-radius: 10px; overflow: hidden; }
  #grid span { font-size: 13px; }
  nav { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; font-size: 13px; }
</style>
</head>
<body>
<nav id="nav"></nav>
<div id="full"></div>
<div id="grid"></div>
<script type="module">
  import { mountPlayer } from '../js/player.js'
  const { demos } = await (await fetch('../player-data/index.json')).json()
  const id = new URLSearchParams(location.search).get('demo') ?? 'report'
  mountPlayer(document.getElementById('full'), { demo: id, data: `../player-data/${id}.json`, autoplay: new URLSearchParams(location.search).has('autoplay') })
  for (const d of demos) {
    const a = document.createElement('a')
    a.href = `?demo=${d.id}`
    a.textContent = d.id
    document.getElementById('nav').append(a)
    const card = document.createElement('a')
    card.href = `?demo=${d.id}`
    const box = document.createElement('div')
    box.className = 'thumb'
    const label = document.createElement('span')
    label.textContent = d.title
    card.append(box, label)
    document.getElementById('grid').append(card)
    mountPlayer(box, { demo: d.id, data: `../player-data/${d.id}.json`, compact: true })
  }
</script>
</body>
</html>
