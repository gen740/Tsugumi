name: Documentation
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'macOS/tools/bundle-docs.sh'
      - 'nix/docs-site.nix'
      - 'nix/flake/docs.nix'
      - 'flake.lock'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'macOS/tools/bundle-docs.sh'
      - 'nix/docs-site.nix'
      - 'nix/flake/docs.nix'
      - 'flake.lock'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The same Node.js and packages as `nix run .#dev-doc` (nix/docs-site.nix).
      - uses: ./.github/actions/setup-nix
      - run: nix run .#build-doc
      - run: nix run .#test-doc
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: build/docs
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the generated site
        id: deployment
        uses: actions/deploy-pages@v4
