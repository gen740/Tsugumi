name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.diff.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          app=true
          if files="$(git diff --name-only "$BASE" HEAD)" && [ -n "$files" ]; then
            others="$(grep -vE '^docs/|^[A-Z_]+\.md$' <<<"$files" || true)"
            read_by_app="$(grep -E '^(README\.md$|docs/(Philosophy|Rationale|Vision)\.md$|docs/site/)' <<<"$files" || true)"
            if [ -z "$others$read_by_app" ]; then app=false; fi
          fi
          matrix=$(jq -cn --argjson app "$app" '{include: ([
            {system: "x86_64-linux", runner: "ubuntu-24.04"},
            {system: "aarch64-linux", runner: "ubuntu-24.04-arm"}
          ] + (if $app then [
            {system: "aarch64-darwin", runner: "macos-26"}
          ] else [] end))}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # Tests that read only files of the repository (tests/static, marked
      # "static"): the same pytest as the Python environments, nothing else.
      - name: Static tests
        run: nix shell --inputs-from . nixpkgs#python3Packages.pytest -c pytest -q -m static tests/static

  platform:
    name: Platform (${{ matrix.system }})
    needs: changes
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    uses: ./.github/workflows/ci-platform.yml
    with:
      system: ${{ matrix.system }}
      runner: ${{ matrix.runner }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' && secrets.CACHIX_AUTH_TOKEN || '' }}

  prompt:
    name: Offline prompt scoring
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests/prompt

  result:
    name: CI
    needs: [changes, static, platform, prompt]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$RESULTS"
          jq -e 'all(.[]; .result == "success")' <<<"$RESULTS" > /dev/null
